<title>Army Passion Prototype</title>
<style>
/* Layout: the real app's chat screen — sidebar, conversation, prompt bar — over a thin prototype banner.
   Tokens copied from frontend/src/app/globals.css so the prototype looks like the app. */
:root {
  --bg: #ffffff;
  --surface: #f6f6f4;
  --surface-2: #ededea;
  --border: #e2e2dd;
  --text: #1b1b18;
  --muted: #6b6b63;
  --accent: #2f6f4e;
  --accent-soft: #e6f1eb;
  --accent-fg: #ffffff;
  --danger: #b3261e;
  --warning: #8a5a00;
  --banner: #1b1b18;
  --banner-fg: #f6f6f4;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141413; --surface: #1d1d1b; --surface-2: #272724; --border: #33332f;
    --text: #ececea; --muted: #9b9b92; --accent: #6cbd92; --accent-soft: #1e332a;
    --accent-fg: #0f1a14; --danger: #f2b8b5; --warning: #e8c37a;
    --banner: #ececea; --banner-fg: #141413; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141413; --surface: #1d1d1b; --surface-2: #272724; --border: #33332f;
  --text: #ececea; --muted: #9b9b92; --accent: #6cbd92; --accent-soft: #1e332a;
  --accent-fg: #0f1a14; --danger: #f2b8b5; --warning: #e8c37a;
  --banner: #ececea; --banner-fg: #141413; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, select, textarea { font: inherit; color: var(--text); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

.banner { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--banner); color: var(--banner-fg); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 8px 16px; font-size: 13px; }
.banner strong { letter-spacing: .04em; text-transform: uppercase; font-size: 12px; }
.banner button { border: 1px solid currentColor; border-radius: 999px; padding: 2px 12px; font-size: 13px; opacity: .9; }

.shell { display: grid; grid-template-columns: 288px minmax(0, 1fr); min-height: calc(100% - 40px); }
.sidebar { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: sticky; top: 38px; height: calc(100vh - 38px); }
.side-head { display: flex; align-items: center; justify-content: space-between; padding: 20px; }
.side-head span { font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
.new-btn { margin: 0 16px; display: flex; gap: 10px; align-items: center; border: 1px solid var(--border); background: var(--bg); border-radius: 999px; padding: 12px 16px; font-weight: 500; }
.new-btn:hover { background: var(--surface-2); }
.recent { flex: 1; overflow-y: auto; padding: 28px 16px 0; }
.recent h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 0 12px 8px; margin: 0; }
.recent button { display: block; width: 100%; text-align: left; padding: 9px 12px; border-radius: 8px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.recent button:hover { background: var(--surface-2); color: var(--text); }
.side-foot { border-top: 1px solid var(--border); padding: 16px 20px; display: flex; gap: 12px; align-items: center; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font-weight: 600; font-size: 13px; flex-shrink: 0; }
.side-foot p { margin: 0; font-size: 13px; }
.side-foot p + p { color: var(--muted); font-size: 12px; }
.menu-btn { display: none; }

.main { display: flex; flex-direction: column; min-width: 0; }
.convo { flex: 1; width: 100%; max-width: 780px; margin: 0 auto; padding: 32px 16px 24px; display: flex; flex-direction: column; gap: 24px; }
.empty h1 { font-size: clamp(28px, 4vw, 36px); font-weight: 600; letter-spacing: -.02em; margin: 40px 0 8px; text-wrap: balance; }
.empty > p { color: var(--muted); font-size: 18px; margin: 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 28px; }
.card-btn { text-align: left; border: 1px solid var(--border); background: var(--surface); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 6px; }
.card-btn:hover { border-color: var(--accent); }
.card-btn b { font-size: 15px; }
.card-btn span { color: var(--muted); font-size: 14px; }
.card-btn em { font-style: normal; font-size: 12px; color: var(--accent); margin-top: 4px; }

.bubble { align-self: flex-end; max-width: 85%; background: var(--surface-2); border-radius: 22px; padding: 10px 18px; white-space: pre-wrap; }
.file-chip { align-self: flex-end; display: flex; gap: 12px; align-items: center; border: 1px solid var(--border); background: var(--surface); border-radius: 16px; padding: 10px 16px; max-width: 85%; }
.file-chip svg { color: var(--accent); flex-shrink: 0; }
.file-chip b { display: block; font-weight: 500; overflow-wrap: anywhere; }
.file-chip small { color: var(--muted); font-size: 12px; }

.panel { border: 1px solid var(--border); background: var(--surface); border-radius: 16px; padding: 20px; }
.panel h2 { font-size: 17px; font-weight: 600; margin: 0; }
.panel .lede { color: var(--muted); margin: 4px 0 0; }
.panel .lede b { color: var(--text); font-weight: 500; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.warn { color: var(--warning); }
.danger { color: var(--danger); }
.ok { color: var(--accent); }
.note { background: var(--accent-soft); border-radius: 8px; padding: 8px 12px; margin-top: 12px; }

.group-head { width: 100%; display: flex; justify-content: space-between; align-items: center; background: var(--surface-2); border-radius: 8px; padding: 10px 12px; margin-top: 16px; text-align: left; font-weight: 500; }
.group-head .tiny { font-weight: 400; color: var(--muted); }
.list { list-style: none; margin: 4px 0 0; padding: 0; }
.list > li { border-top: 1px solid var(--border); padding: 10px 0; }
.row-line { display: flex; align-items: flex-start; gap: 12px; }
.row-line .rownum { width: 52px; flex-shrink: 0; font-size: 12px; color: var(--muted); padding-top: 2px; }
.row-line .who { flex: 1; min-width: 0; }
.row-line .who b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-line .who small { display: block; color: var(--muted); font-size: 12px; }
.row-line .tags { display: flex; gap: 8px; align-items: center; flex-shrink: 0; font-size: 12px; padding-top: 2px; flex-wrap: wrap; justify-content: flex-end; }
.link { color: var(--accent); text-decoration: underline; font-size: inherit; }
.link.muted-link { color: var(--muted); }
.strike { text-decoration: line-through; color: var(--muted); }
.detail { padding: 8px 0 0 64px; display: flex; flex-direction: column; gap: 6px; }
.changes { width: 100%; border-collapse: collapse; font-size: 14px; }
.changes td { padding: 3px 12px 3px 0; vertical-align: top; }
.changes td:first-child { color: var(--muted); }
.changes td:last-child { font-weight: 500; }
.table-wrap { overflow-x: auto; }

.mapping-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px 16px; border-top: 1px solid var(--border); padding: 12px 0; }
.mapping-row p { margin: 0; }
.mapping-row small { color: var(--muted); font-size: 12px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.field { width: 100%; border: 1px solid var(--border); background: var(--bg); border-radius: 8px; padding: 8px 12px; }
.field:focus { border-color: var(--accent); outline: none; }

.recog { list-style: none; margin: 4px 0 0; padding: 0; }
.recog li { display: flex; gap: 8px; border-top: 1px solid var(--border); padding: 6px 4px; font-size: 14px; }
.recog li span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recog li span:last-child { font-weight: 500; }
.newbox { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; margin-top: 16px; }
.newbox p { margin: 0; }

.actions { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; border-top: 1px solid var(--border); margin-top: 20px; padding-top: 16px; }
.btn { background: var(--accent); color: var(--accent-fg); border-radius: 999px; padding: 10px 20px; font-weight: 500; }
.btn:disabled { background: var(--surface-2); color: var(--muted); cursor: not-allowed; }
.btn.sm { padding: 6px 16px; font-size: 14px; }
.btn-ghost { border: 1px solid var(--border); border-radius: 999px; padding: 6px 16px; font-size: 14px; }
.btn-ghost:hover { background: var(--surface-2); }

.editor { margin-top: 8px; border: 1px solid var(--border); background: var(--bg); border-radius: 8px; padding: 12px; }
.editor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px 12px; }
.editor label { display: block; }
.editor label > span { display: block; font-size: 12px; color: var(--muted); }
.editor label > span i { font-style: normal; color: var(--accent); margin-left: 4px; }
.editor .field { padding: 6px 10px; font-size: 14px; margin-top: 2px; }

.cols { margin-top: 16px; border: 1px solid var(--border); border-radius: 8px; }
.cols-head { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; text-align: left; font-weight: 500; }
.cols-body { border-top: 1px solid var(--border); padding: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; margin: 0; padding: 0; }
.chip { display: flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--bg); border-radius: 999px; padding: 4px 6px 4px 12px; font-size: 14px; }
.chip.added { border-color: var(--accent); background: var(--accent-soft); }
.chip .pill { border: 1px solid var(--border); border-radius: 999px; padding: 0 8px; font-size: 12px; color: var(--muted); }
.chip .pill:hover { border-color: var(--text); color: var(--text); }
.chip .pill.del { border-color: var(--danger); color: var(--danger); }
.chip .pill.del:hover { background: var(--danger); color: var(--bg); }
.chip.plain { padding-right: 12px; }
.add-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; margin-top: 12px; align-items: center; }
.chip.off { color: var(--muted); background: transparent; border-style: dashed; padding-right: 12px; }
.chip.new { border-color: var(--accent); background: var(--accent-soft); padding-right: 12px; }
.chip.new b { font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: .04em; }
.modal-back { position: fixed; inset: 0; background: rgb(0 0 0 / .45); z-index: 100; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--bg); border-radius: 16px; padding: 24px; width: min(400px, 100%); box-shadow: 0 16px 48px rgb(0 0 0 / .25); }
.modal h3 { margin: 0; font-size: 18px; font-weight: 600; }
.modal p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
.modal .modal-btns { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
.modal .modal-btns button { width: 100%; padding: 12px; font-size: 15px; }
.modal { max-height: 90vh; overflow-y: auto; }
.modal.wide { width: min(880px, 100%); }
.fmodal { padding: 0; display: flex; flex-direction: column; overflow: hidden; }
.fmodal-head { padding: 18px 24px 14px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: flex-start; }
.fmodal-head > div { flex: 1; min-width: 0; }
.fmodal-head .x { color: var(--muted); padding: 4px; border-radius: 8px; }
.fmodal-head .x:hover { background: var(--surface-2); color: var(--text); }
.pill-warn { display: inline-block; margin-top: 8px; border: 1px solid var(--warning); color: var(--warning); border-radius: 999px; padding: 1px 10px; font-size: 12px; }
.pill-ok { display: inline-block; margin-top: 8px; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 1px 10px; font-size: 12px; }
.fmodal-body { overflow-y: auto; padding: 16px 24px 24px; display: flex; flex-direction: column; gap: 14px; background: var(--surface); }
.fsec { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px 16px; }
.fsec-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.fsec-head b { font-size: 15px; font-weight: 600; }
.fgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 14px; }
.fgrid .span2 { grid-column: span 2; }
.modal .fgrid label { margin: 0; font-size: 12px; }
.modal .fgrid .field { margin-top: 4px; padding: 8px 10px; font-size: 15px; }
.fgrid .field.missing { border: 1px dashed var(--warning); }
.fgrid .field.missing::placeholder { color: var(--warning); opacity: .8; }
.fmodal-foot { border-top: 1px solid var(--border); padding: 14px 24px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; }
.amt { display: flex; gap: 20px; flex-wrap: wrap; }
.amt span { display: block; font-size: 12px; color: var(--muted); }
.amt b { font-size: 16px; }
.amt .big b { color: var(--accent); font-size: 18px; }
@media (max-width: 767px) { .fgrid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .fmodal-head, .fmodal-body, .fmodal-foot { padding-left: 16px; padding-right: 16px; } }
@media (max-width: 480px) { .fgrid { grid-template-columns: minmax(0, 1fr); } .fgrid .span2 { grid-column: auto; } }
.modal .editor-grid label { margin-top: 0; }
.modal-foot { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 20px; }
.modal label { display: block; margin-top: 10px; font-size: 13px; color: var(--muted); }
.modal label .field { margin-top: 2px; color: var(--text); font-size: 15px; }

.col-grid { list-style: none; margin: 16px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.col-item { display: flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--bg); border-radius: 10px; padding: 6px 6px 6px 12px; }
.col-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.tag-new { font-size: 10px; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 1px 5px; text-transform: uppercase; letter-spacing: .04em; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin: -4px 0 8px; }
.tab { padding: 10px 16px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab span { font-size: 12px; font-weight: 400; background: var(--surface-2); border-radius: 999px; padding: 1px 8px; margin-left: 4px; }
.tab:hover { color: var(--text); }
.tab.on { color: var(--accent); border-bottom-color: var(--accent); }
.tab.on span { background: var(--accent-soft); color: var(--accent); }
.up-row .tags { align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; background: var(--bg); }
.seg button { padding: 3px 12px; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button.on { background: var(--accent); color: var(--accent-fg); }
.fgrid label .warn { display: block; margin-top: 2px; }
.cea-row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.cea-row .who { flex: 1 1 220px; min-width: 0; }
.cea-row .who b { display: block; font-weight: 500; }
.cea-row .who small { display: block; color: var(--muted); font-size: 12px; }
.cea-row .who small.warn { color: var(--warning); }
.cea-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.icon-sq { border: 1px solid var(--border); border-radius: 8px; padding: 6px; display: grid; place-items: center; color: var(--muted); }
.icon-sq:hover { color: var(--text); background: var(--surface-2); }
.icon-sq.del:hover { color: var(--danger); border-color: var(--danger); }
.btn-ghost { display: inline-flex; align-items: center; gap: 6px; }
.form-sec { font-size: 12px; margin: 20px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.field.missing { border-color: var(--warning); }
.claim { display: flex; flex-wrap: wrap; gap: 8px 24px; background: var(--accent-soft); border-radius: 8px; padding: 12px; margin-top: 20px; }
.claim b { display: block; font-size: 17px; }
.claim span { font-size: 12px; color: var(--muted); }
.confirm { margin-top: 8px; border: 1px solid var(--danger); border-radius: 8px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }

.picker-list { list-style: none; margin: 8px 0 0; padding: 0; max-height: 300px; overflow-y: auto; }
.picker-list button { width: 100%; text-align: left; border-top: 1px solid var(--border); padding: 10px 4px; }
.picker-list button:hover { background: var(--surface-2); }
.picker-list b { display: block; font-weight: 500; }
.picker-list small { color: var(--muted); font-size: 12px; }
.radios { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.radios label { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.docs { list-style: none; margin: 4px 0 0; padding: 0; }
.docs li { display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid var(--border); padding: 6px 0; font-size: 14px; }
.badge { border-radius: 4px; background: var(--surface-2); padding: 1px 6px; font-size: 12px; color: var(--muted); }

.composer { position: sticky; bottom: 0; background: var(--bg); padding: 8px 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
.composer-inner { max-width: 748px; margin: 0 auto; position: relative; }
.prompt { display: flex; align-items: flex-end; gap: 8px; border: 1px solid var(--border); background: var(--surface); border-radius: 24px; padding: 8px 10px; }
.prompt:focus-within { border-color: var(--accent); }
.icon-btn { border-radius: 999px; padding: 9px; color: var(--muted); display: grid; place-items: center; }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.send { background: var(--accent); color: var(--accent-fg); border-radius: 999px; padding: 9px; display: grid; place-items: center; }
.send:disabled { background: var(--surface-2); color: var(--muted); }
#prompt-input { flex: 1; min-width: 0; resize: none; border: 0; background: transparent; padding: 9px 0; font-size: 16px; outline: none; max-height: 160px; }
.attach-menu { position: absolute; bottom: calc(100% + 8px); left: 0; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 6px; width: min(340px, 100%); box-shadow: 0 8px 24px rgb(0 0 0 / .12); z-index: 10; }
.attach-menu p { margin: 4px 8px 6px; font-size: 12px; color: var(--muted); }
.attach-menu button { display: block; width: 100%; text-align: left; padding: 8px; border-radius: 8px; }
.attach-menu button:hover { background: var(--surface-2); }
.attach-menu small { display: block; color: var(--muted); font-size: 12px; }
.footnote { text-align: center; color: var(--muted); font-size: 12px; margin: 8px 0 0; }

@media (max-width: 767px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: fixed; inset: 0 auto 0 0; width: 280px; height: 100%; z-index: 60; transform: translateX(-100%); transition: transform .2s; }
  .sidebar.open { transform: none; }
  .scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .4); z-index: 55; }
  .menu-btn { display: inline-grid; place-items: center; padding: 8px; border-radius: 8px; color: var(--muted); }
  .mobile-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px 0; }
  .mapping-row { grid-template-columns: minmax(0, 1fr); }
  .detail { padding-left: 0; }
  .add-row { grid-template-columns: minmax(0, 1fr); }
}
@media (min-width: 768px) { .mobile-head { display: none; } }
@media (prefers-reduced-motion: reduce) { .sidebar { transition: none; } }
</style>
