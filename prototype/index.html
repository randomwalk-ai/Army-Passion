      <button type="button" class="menu-btn" data-act="open-menu" aria-label="Open menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <span class="muted">Army Passion</span>
    </div>

    <div class="convo" id="convo" aria-live="polite"></div>

    <div class="composer">
      <div class="composer-inner">
        <div class="attach-menu" id="attach-menu" hidden>
          <p>Sample files (made up)</p>
          <button type="button" data-act="drop-excel" data-variant="extra"><b>widows_sheet_with_extra_columns.xlsx</b><small>4 new columns · 30 rows</small></button>
        </div>
        <div class="prompt">
          <button type="button" class="icon-btn" data-act="toggle-attach" aria-label="Attach an Excel sheet, voice note or document" title="Attach a file">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21.44 11.05l-8.49 8.49a5.5 5.5 0 01-7.78-7.78l8.49-8.49a3.67 3.67 0 115.18 5.18l-8.49 8.49a1.83 1.83 0 11-2.59-2.59l7.78-7.78" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <textarea id="prompt-input" rows="1" placeholder="Ask something, or attach an Excel sheet, voice note or document"></textarea>
          <button type="button" class="send" id="send-btn" data-act="send" aria-label="Send" disabled>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <p class="footnote">Mock data only. Always check important details before acting on them.</p>
      </div>
    </div>
  </main>
</div>

<script>
(() => {
  "use strict";

  // ---------- made-up data, generated the same way every time ----------
  function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  let rand = rng(4242);
  const pick = (a) => a[Math.floor(rand() * a.length)];
  const digits = (n) => String(6 + Math.floor(rand() * 4)) + Array.from({ length: n - 1 }, () => Math.floor(rand() * 10)).join("");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

  const WOMEN = ["Sunita", "Kamlesh", "Santosh", "Bimla", "Rekha", "Savitri", "Meena", "Pushpa", "Harjit", "Paramjit", "Baljit", "Lakshmi", "Selvi", "Sheela", "Bindu", "Mita", "Sunanda", "Mangal", "Anita", "Suman", "Rajbala", "Omwati"];
  const MEN = ["Rajbir", "Satpal", "Balwant", "Krishan", "Surender", "Gurpreet", "Jagtar", "Murugan", "Rajan", "Subrata", "Dattatray", "Dinesh", "Mahesh", "Ravinder", "Devender", "Naresh"];
  const SURNAMES = ["Rathee", "Dahiya", "Malik", "Yadav", "Sharma", "Tomar", "Sangwan", "Negi", "Rawat", "Patil", "Jadhav", "Pillai", "Nair", "Ghosh", "Beniwal", "Chauhan"];
  const BOYS = ["Rahul", "Aman", "Karan", "Rohit", "Vivek", "Akash", "Sahil", "Yash"];
  const GIRLS = ["Priya", "Neha", "Pooja", "Simran", "Jyoti", "Komal", "Ritu", "Sneha"];
  const PLACES = [["Rohtak", "Haryana", "28.8955, 76.6066"], ["Hisar", "Haryana", "29.1492, 75.7217"], ["Jind", "Haryana", "29.3159, 76.3146"], ["Ludhiana", "Punjab", "30.9010, 75.8573"], ["Moga", "Punjab", "30.8158, 75.1711"], ["Meerut", "Uttar Pradesh", "28.9845, 77.7064"], ["Jhansi", "Uttar Pradesh", "25.4484, 78.5685"], ["Pauri Garhwal", "Uttarakhand", "30.1469, 78.7800"], ["Kangra", "Himachal Pradesh", "32.0998, 76.2691"], ["Satara", "Maharashtra", "17.6868, 74.0183"], ["Palakkad", "Kerala", "10.7867, 76.6548"], ["Madurai", "Tamil Nadu", "9.9252, 78.1198"]];
  const REGIMENTS = ["The Rajput Regiment", "The Jat Regiment", "The Punjab Regiment", "The Sikh Regiment", "The Garhwal Rifles", "The Dogra Regiment", "The Maratha Light Infantry", "The Madras Regiment"];
  const RANKS = ["SEP", "SEP", "L NK", "NK", "HAV", "HAV", "NB SUB", "SUB"];
  const TEHSILS = ["SADAR", "KHARKHODA", "MEHAM", "BARWALA", "NANGAL", "GOHANA"];
  const TOWNS = ["RAMPURA", "SOHNA", "KALANAUR", "LADWA", "SAFIDON", "HANSI"];
  const VILLAGES = ["KARONTHA", "SYONDI", "KANSALA", "NAMOL", "RISALI", "KHERA"];
  const BANKS = ["State Bank of India", "Punjab National Bank", "Canara Bank", "Bank of Baroda"];

  // The colonel's LIST OF FIELDS, in his order, and where each heading goes.
  const HEADINGS = [
    ["S NO", null], ["DATE OF CAUALTY", "date_of_death"], ["SERVING UNIT", "unit"], ["SAINIK ARMY NO", "service_number"],
    ["RANK", "rank"], ["NAME", "soldier_name"], ["NAME OF NOK", "widow_name"], ["RELATIONSHIP", "nok_relationship"],
    ["DISTRICT", "district"], ["TEHSIL", "tehsil"], ["TOWN", "town"], ["VILLAGE", "village"], ["POST OFFICE", "post_office"],
    ["STATE", "state"], ["PIN CODE", "pincode"], ["TELE NO", "phone"], ["PARENT UNIT", "regiment"], ["GEOLOCATION", "geolocation"],
    ["Name_of_Child1", "child1_name"], ["Sex_Child1", "child1_sex"], ["DOB_Child1", "child1_dob"], ["Marital_Status_Child1", "child1_marital"],
    ["Name_of_Child2", "child2_name"], ["Sex_Child2", "child2_sex"], ["DOB_Child2", "child2_dob"], ["Marital_Status_Child2", "child2_marital"],
    ["Name_of_Child3", "child3_name"], ["Sex_Child3", "child3_sex"], ["DOB_Child3", "child3_dob"], ["Marital_Status_Child3", "child3_marital"],
    ["Pension Bank", "bank_name"], ["Pension Bank Branch", "bank_branch"], ["PPO", "ppo_number"], ["Bank_Account _Number", "bank_account_number"],
    ["NOK_Telephone", "alternate_phone"], ["Email", "email"], ["CO_Unit_Name", "co_unit_name"], ["CO_Unit_Telephone_No1", "co_unit_phone"],
    ["DOCUMENTS 1", null], ["DOCUMENTS 2", null], ["DOCUMENTS 3", null], ["DOCUMENTS 4", null],
  ];
  const EXTRA_HEADINGS = [["Ward Member Name", "extra:ward_member_name"], ["Panchayat", "extra:panchayat"], ["Zone Code", "extra:zone_code"]];

  const FIELDS = {
    date_of_death: ["Date of casualty", "Soldier"], unit: ["Serving unit", "Soldier"], service_number: ["Army number", "Soldier"],
    rank: ["Rank", "Soldier"], soldier_name: ["Soldier's name", "Soldier", true], regiment: ["Parent unit", "Soldier"],
    cause_of_death: ["Cause of death", "Soldier"], place_of_death: ["Place of death", "Soldier"],
    widow_name: ["Name of NOK", "Next of kin", true], nok_relationship: ["Relationship", "Next of kin"], phone: ["Phone number", "Next of kin"],
    alternate_phone: ["NOK telephone", "Next of kin"], email: ["Email", "Next of kin"],
    village: ["Village", "Address"], town: ["Town", "Address"], tehsil: ["Tehsil", "Address"], post_office: ["Post office", "Address"],
    district: ["District", "Address"], state: ["State", "Address"], pincode: ["PIN code", "Address"], geolocation: ["GPS location of house", "Address"],
    ppo_number: ["PPO number", "Pension and bank"], bank_name: ["Pension bank", "Pension and bank"], bank_branch: ["Pension bank branch", "Pension and bank"],
    bank_account_number: ["Bank account number", "Pension and bank"], bank_ifsc: ["IFSC code", "Pension and bank"],
    bank_account_holder: ["Account holder's name", "Pension and bank"], bank_address: ["Bank address", "Pension and bank"],
    co_unit_name: ["CO unit name", "Unit contact"], co_unit_phone: ["CO unit telephone", "Unit contact"],
    record_office: ["Record office", "CEA"], correspondence_address: ["Correspondence address", "CEA"], correspondence_pincode: ["Correspondence PIN code", "CEA"],
    annual_income: ["Annual income", "Other"], notes: ["Notes or remarks", "Other"],
  };
  for (const n of [1, 2, 3]) {
    FIELDS[`child${n}_name`] = [`Child ${n} name`, "Children"];
    FIELDS[`child${n}_sex`] = [`Child ${n} sex`, "Children"];
    FIELDS[`child${n}_dob`] = [`Child ${n} date of birth`, "Children"];
    FIELDS[`child${n}_marital`] = [`Child ${n} marital status`, "Children"];
  }

  // New columns the colonel has brought in from his sheets (the "pocket"). Starts empty.
  function freshExtras() { return {}; }

  // A renamed column shows its new name everywhere.
  const label = (key, extras) => S.renamed[key] ?? (key.startsWith("extra:") ? (extras[key]?.label ?? key.slice(6).replace(/_/g, " ")) : (FIELDS[key]?.[0] ?? key));
  const isRequired = (key) => !!FIELDS[key]?.[2];

  function dob(minAge, maxAge) {
    const age = minAge + Math.floor(rand() * (maxAge - minAge + 1));
    const d = 1 + Math.floor(rand() * 28), m = 1 + Math.floor(rand() * 12), y = 2026 - age;
    return `${String(d).padStart(2, "0")}-${String(m).padStart(2, "0")}-${y}`;
  }

  function person() {
    const surname = pick(SURNAMES);
    const [district, state, gps] = pick(PLACES);
    const regiment = pick(REGIMENTS);
    const short = regiment.replace(/^The /, "").split(" ")[0].toUpperCase();
    const kids = [];
    const count = Math.floor(rand() * 4);
    for (let i = 0; i < count; i++) {
      const boy = rand() < 0.5;
      kids.push({ name: `${pick(boy ? BOYS : GIRLS)} ${surname}`, sex: boy ? "male" : "female", dob: dob(3, 24), marital: rand() < 0.15 ? "Married" : "Unmarried" });
    }
    const values = {
      date_of_death: dob(1, 10).replace(/-\d{4}$/, (y) => "-" + String(2016 + Math.floor(rand() * 10))),
      unit: `${1 + Math.floor(rand() * 21)} ${short}`, service_number: `${1000000 + Math.floor(rand() * 18000000)}${pick(["", "", "A", "H", "K"])}`,
      rank: pick(RANKS), soldier_name: `${pick(MEN)} ${surname}`, widow_name: `${pick(WOMEN)} ${surname}`, nok_relationship: "WIFE",
      district, tehsil: pick(TEHSILS), town: pick(TOWNS), village: pick(VILLAGES), post_office: pick(VILLAGES), state,
      pincode: rand() < 0.7 ? String(110001 + Math.floor(rand() * 600000)) : "", phone: rand() < 0.9 ? "+91" + digits(10) : "",
      regiment, geolocation: rand() < 0.75 ? gps : "", ppo_number: `${pick(["S", "F"])}/${100000 + Math.floor(rand() * 900000)}/${2016 + Math.floor(rand() * 10)}`,
      bank_name: pick(BANKS), bank_branch: `${district} ${pick(["Main", "Cantt", "City"])} Branch`,
      bank_account_number: String(10000000000 + Math.floor(rand() * 89999999999)), alternate_phone: rand() < 0.4 ? "+91" + digits(10) : "",
      email: rand() < 0.3 ? `${surname.toLowerCase()}${10 + Math.floor(rand() * 89)}@mockmail.example` : "",
      co_unit_name: `${1 + Math.floor(rand() * 21)} ${regiment.replace(/^The /, "")}`, co_unit_phone: rand() < 0.6 ? "+91" + digits(10) : "",
      "extra:ward_member_name": pick(["Suresh Kumar", "Ramesh Lal", "Harbans Singh", "Meena Devi"]),
      "extra:panchayat": pick(["Kotla", "Nangal", "Rampur", "Khera", "Dhani"]), "extra:zone_code": "Z-" + (1 + Math.floor(rand() * 7)),
    };
    kids.forEach((k, i) => {
      const n = i + 1;
      values[`child${n}_name`] = k.name; values[`child${n}_sex`] = k.sex; values[`child${n}_dob`] = k.dob; values[`child${n}_marital`] = k.marital;
    });
    return values;
  }

  // Families already "on record", for the document picker and the update rows.
  function buildFamilies() {
    rand = rng(77);
    const list = [];
    for (let i = 0; i < 40; i++) {
      const v = person();
      const members = [{ id: `m${i}-0`, name: v.widow_name, rel: "NOK" }];
      for (const n of [1, 2, 3]) if (v[`child${n}_name`]) members.push({ id: `m${i}-${n}`, name: v[`child${n}_name`], rel: v[`child${n}_sex`] === "male" ? "son" : "daughter", dob: v[`child${n}_dob`],
        cls: "", school: "", schoolPlace: "", board: "", admission: "", hostel: false });
      list.push({ code: `AP-2026-${String(i + 1).padStart(4, "0")}`, values: v, members, docs: [{ type: "Death certificate", who: "Whole family", file: false }, { type: "PPO (Pension Payment Order)", who: "Whole family", file: false }] });
    }
    return list;
  }

  function buildRows(variant, families) {
    rand = rng(variant === "extra" ? 31 : 13);
    const plan = variant === "extra" ? { create: 12, update: 12, unchanged: 0, needs: 6, dup: 0 } : { create: 43, update: 9, unchanged: 3, needs: 5, dup: 3 };
    const rows = [];
    let n = 2; // row 1 is the heading row
    const add = (r) => { r.id = "r" + n; r.rowNum = n++; r.edited = new Set(); r.excluded = false; rows.push(r); };

    for (let i = 0; i < plan.update; i++) {
      const fam = families[i % families.length];
      const v = { ...fam.values, phone: "+91" + digits(10), bank_branch: fam.values.bank_branch.includes("Main") ? fam.values.bank_branch.replace("Main", "Cantt") : `${fam.values.district} Main Branch` };
      const changes = [
        ["Phone number", fam.values.phone || "(blank)", v.phone],
        ["Pension bank branch", fam.values.bank_branch, v.bank_branch],
      ];
      if (i === 0) {
        const boy = rand() < 0.5;
        const slot = [1, 2, 3].find((s) => !fam.values[`child${s}_name`]) || 3;
        v[`child${slot}_name`] = `${pick(boy ? BOYS : GIRLS)} ${fam.values.widow_name.split(" ").pop()}`;
        v[`child${slot}_sex`] = boy ? "male" : "female"; v[`child${slot}_dob`] = dob(4, 9); v[`child${slot}_marital`] = "Unmarried";
        changes.push([`Child ${slot}`, null, `${v[`child${slot}_name`]} (new child)`]);
      }
      if (i === 1 && fam.values.child1_dob) {
        const old = fam.values.child1_dob; const [d, m, y] = old.split("-");
        v.child1_dob = `${String(Math.min(28, +d + 1)).padStart(2, "0")}-${m}-${y}`;
        changes.push(["Child 1 date of birth", old, v.child1_dob]);
      }
      add({ action: "update", values: v, code: fam.code, changes, reasons: [`Same service number (${fam.values.service_number})`, "Widow's name is the same", "Soldier's name is the same", `Same district (${fam.values.district})`, "Same date of death"], score: 100, problems: [] });
    }
    for (let i = 0; i < plan.unchanged; i++) {
      const fam = families[(plan.update + i) % families.length];
      add({ action: "unchanged", values: { ...fam.values }, code: fam.code, changes: [], reasons: [`Same service number (${fam.values.service_number})`], score: 100, problems: [] });
    }
    for (let i = 0; i < plan.create; i++) {
      const v = person();
      const problems = [];
      if (i === 4) v.phone = "98765 4321";
      if (i === 9) v.date_of_death = "31-02-2020";
      const near = rand() < 0.15 ? families[Math.floor(rand() * families.length)] : null;
      add({ action: "create", values: v, changes: [], problems, code: near?.code, score: near ? 30 : 0, reasons: near ? ["Widow's name is the same"] : [] });
    }
    for (let i = 0; i < plan.needs; i++) {
      const fam = families[(i + 5) % families.length];
      const v = person(); v.widow_name = fam.values.widow_name; v.district = fam.values.district; v.state = fam.values.state;
      const both = i % 2 === 0;
      add({ action: "needs", values: v, code: fam.code, changes: [], problems: [], score: both ? 60 : 45, reasons: both ? ["Widow's name is the same", "Soldier's name is the same"] : ["Widow's name is the same", `Same district (${fam.values.district})`] });
    }
    for (let i = 0; i < plan.dup; i++) {
      const source = rows[plan.update + plan.unchanged + 5 + i * 7];
      add({ action: "dup", values: { ...source.values }, changes: [], problems: [], dupOf: source.rowNum });
    }
    return rows;
  }

  // ---------- state ----------
  let S;
  function reset() {
    // alwaysOff: columns removed for good — skipped on every future Excel, saved values kept.
    S = { entries: [], families: buildFamilies(), extras: freshExtras(), alwaysOff: new Set(), renamed: {}, seq: 0, menu: false, attach: false };
    render();
  }
  const newId = () => "e" + (++S.seq);
  const entry = (id) => S.entries.find((e) => e.id === id);
  const rowOf = (e, rid) => e.rows.find((r) => r.id === rid);

  // ---------- helpers for an Excel upload ----------
  // The second sample has "UNIT" and three headings we have no column for; they come in as new columns.
  function headingsOf(variant) {
    if (variant !== "extra") return HEADINGS;
    return [...HEADINGS.map(([h, k]) => h === "SERVING UNIT" ? ["UNIT", "extra:unit"] : [h, k]), ...EXTRA_HEADINGS];
  }
  const colName = (c) => S.renamed[c.key] ?? c.heading ?? label(c.key, S.extras);
  const slug = (text) => text.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "");
  const PHONE_KEYS = new Set(["phone", "alternate_phone", "co_unit_phone"]);
  const isDateKey = (k) => k === "date_of_death" || /_dob$/.test(k);
  const phoneDigits = (v) => v.replace(/\D/g, "").replace(/^91(?=\d{10}$)/, "");
  const cleanPhone = (v) => "+91" + phoneDigits(v);
  const display = (key, v) => (key.endsWith("_sex") && v) ? (v === "male" ? "male" : "female") : v;
  function dateOk(v) {
    const m = v.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/); if (!m) return false;
    const d = new Date(+m[3], +m[2] - 1, +m[1]);
    return d.getDate() === +m[1] && d.getMonth() === +m[2] - 1 && d <= new Date(2026, 10, 30);
  }
  // Only clear-cut mistakes: a phone that isn't 10 digits, a date that doesn't exist.
  function rowProblems(e, r) {
    const out = [];
    for (const c of e.cols) {
      const v = String(r.values[c.key] || "").trim();
      if (!v) continue;
      if (PHONE_KEYS.has(c.key) && phoneDigits(v).length !== 10) out.push({ key: c.key, text: `${colName(c)} has ${phoneDigits(v).length} digits` });
      if (isDateKey(c.key) && !dateOk(v)) out.push({ key: c.key, text: `${colName(c)} '${v}' isn't a real date` });
    }
    return out;
  }
  // New families, updates, duplicates. Rows with nothing new are not shown at all.
  function groupOf(r) {
    if (r.action === "update") return "update";
    if (r.action === "needs" || r.action === "dup") return "dup";
    if (r.action === "create") return "new";
    return null;
  }
  const liveRows = (e) => e.rows.filter((r) => !r.deleted);
  // A duplicate is imported only if he clicks Include.
  const willImport = (r) => groupOf(r) === "new" || groupOf(r) === "update" || (groupOf(r) === "dup" && r.included);

  // ---------- rendering ----------
  const icons = {
    excel: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="4" width="17" height="16" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 9.5h17M9.5 9.5V20M3.5 15h17" stroke="currentColor" stroke-width="1.8"/></svg>',
    doc: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3.5h7l4 4V20a.5.5 0 0 1-.5.5h-10A.5.5 0 0 1 7 20V3.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3.5V8h4M9.5 12.5h5M9.5 16h5" stroke="currentColor" stroke-width="1.8"/></svg>',
  };

  function render() {
    const c = document.getElementById("convo");
    c.innerHTML = S.entries.length ? S.entries.map(renderEntry).join("") : renderEmpty();
    document.getElementById("attach-menu").hidden = !S.attach;
    document.getElementById("sidebar").classList.toggle("open", S.menu);
    document.getElementById("scrim").hidden = !S.menu;
  }

  function renderEmpty() {
    return `<div class="empty">
      <h1>Good to see you, Colonel</h1>
      <p>What would you like to do?</p>
      <div class="cards">
        <button type="button" class="card-btn" data-act="drop-excel" data-variant="extra"><b>Upload Excel</b><span>Sample sheet with 4 new columns</span></button>        <button type="button" class="card-btn" data-act="cea-choose"><b>Fill a form</b><span>CEA — see who qualifies, fill and download</span></button>
      </div>
    </div>`;
  }

  function renderEntry(e) {
    if (e.kind === "text") return `<p class="bubble">${esc(e.text)}</p>`;
    if (e.kind === "cea") return renderCea(e);
    const chip = `<div class="file-chip">${e.kind === "doc" ? icons.doc : icons.excel}<div><b>${esc(e.file)}</b><small>${esc(e.size)}</small></div></div>`;
    if (e.kind === "doc") return chip + renderDoc(e);
    return chip + renderExcel(e);
  }

  // ----- Excel upload: step 1 columns, step 2 rows -----
  function renderExcel(e) {
    if (e.stage === "reading") return `<p class="muted">Reading the sheet...</p>`;
    if (e.stage === "columns") return renderColumnsStep(e);
    if (e.stage === "done") return renderResult(e);
    return renderRowsStep(e);
  }

  // Two tabs at the top of the upload: Columns and Rows.
  const uploadTabs = (e, on) => `<div class="tabs" role="tablist">
    <button type="button" role="tab" aria-selected="${on === "columns"}" class="tab ${on === "columns" ? "on" : ""}" data-act="up-back" data-id="${e.id}">Columns <span>${e.cols.length}</span></button>
    <button type="button" role="tab" aria-selected="${on === "rows"}" class="tab ${on === "rows" ? "on" : ""}" data-act="up-continue" data-id="${e.id}">Rows <span>${liveRows(e).filter((r) => groupOf(r)).length}</span></button>
  </div>`;

  function renderColumnsStep(e) {
    return `<div class="panel">
      ${uploadTabs(e, "columns")}
      <ul class="col-grid">${e.cols.map((c) => `<li class="col-item">
        <span class="col-name">${esc(colName(c))}${c.isNew ? ` <b class="tag-new">New</b>` : ""}</span>
        <button type="button" class="icon-sq" data-act="up-rename" data-id="${e.id}" data-key="${esc(c.key)}" title="Rename" aria-label="Rename ${esc(colName(c))}">${ceaIcons.pencil}</button>
        ${isRequired(c.key) ? "" : `<button type="button" class="icon-sq del" data-act="up-delcol" data-id="${e.id}" data-key="${esc(c.key)}" title="Delete" aria-label="Delete ${esc(colName(c))}">${ceaIcons.trash}</button>`}
      </li>`).join("")}</ul>
      <p style="margin:12px 0 0"><button type="button" class="link" data-act="up-addcol" data-id="${e.id}">+ Add column</button></p>
      <div class="actions"><button type="button" class="btn" data-act="up-continue" data-id="${e.id}">Next</button></div>
      ${renderUploadModal(e)}
    </div>`;
  }

  const UP_GROUPS = [["new", "New families"], ["update", "Updates"], ["dup", "Duplicates"]];

  function renderRowsStep(e) {
    const rows = liveRows(e);
    const toImport = rows.filter(willImport).length;
    const groups = UP_GROUPS.map(([g, title]) => {
      const list = rows.filter((r) => groupOf(r) === g);
      if (!list.length) return "";
      const open = e.open[g] ?? g === "dup";
      return `<button type="button" class="group-head" data-act="toggle-group" data-id="${e.id}" data-g="${g}"><span>${title} (${list.length})</span><span class="tiny">${open ? "hide" : "show"}</span></button>
        ${open ? `<ul class="list">${list.map((r) => renderUpRow(e, r)).join("")}</ul>` : ""}`;
    }).join("");
    return `<div class="panel">
      ${uploadTabs(e, "rows")}
      ${groups}
      <p style="margin:12px 0 0"><button type="button" class="link" data-act="up-addrow" data-id="${e.id}">+ Add row</button></p>
      <div class="actions">
        <button type="button" class="btn" data-act="up-import" data-id="${e.id}" ${toImport ? "" : "disabled"}>Import ${toImport} rows</button>
      </div>
      ${renderUploadModal(e)}
    </div>`;
  }

  function renderUpRow(e, r) {
    const g = groupOf(r);
    const probs = rowProblems(e, r);
    const who = r.values.widow_name || r.values.soldier_name || "(no name)";
    const sub = [r.values.district, g === "dup" ? (r.dupOf ? `same as row ${r.dupOf}` : `like ${r.code}, already saved`) : ""].filter(Boolean).join(" · ");
    return `<li><div class="row-line up-row">
      <span class="rownum">${r.added ? "Added" : `Row ${r.rowNum}`}</span>
      <span class="who"><b>${esc(who)}</b><small>${esc(sub)}</small></span>
      <span class="tags">
        ${r.edited.size ? `<span class="ok">edited</span>` : ""}
        ${g === "update" ? `<span class="muted">${r.changes.length} change${r.changes.length === 1 ? "" : "s"}</span>` : ""}
        ${probs.length ? `<span class="warn">${probs.length} problem${probs.length === 1 ? "" : "s"}</span>` : ""}
        <button type="button" class="icon-sq" data-act="up-row" data-id="${e.id}" data-r="${r.id}" title="Edit row" aria-label="Edit row ${r.rowNum}">${ceaIcons.pencil}</button>
        ${g === "dup" ? `<button type="button" class="${r.included ? "btn sm" : "btn-ghost"}" data-act="up-include" data-id="${e.id}" data-r="${r.id}">${r.included ? "Included ✓" : "Include"}</button>` : `<button type="button" class="icon-sq del" data-act="up-delrow" data-id="${e.id}" data-r="${r.id}" title="Delete row" aria-label="Delete row ${r.rowNum}">${ceaIcons.trash}</button>`}
      </span></div></li>`;
  }

  // Every column of the row as a box. A box with a problem gets an orange border and the reason under it.
  function upFields(e, r) {
    const probs = r ? rowProblems(e, r) : [];
    return `<div class="fgrid">${e.cols.map((c) => {
      const v = r ? display(c.key, String(r.values[c.key] || "")) : "";
      const p = probs.find((x) => x.key === c.key);
      return `<label>${esc(colName(c))}${r?.edited.has(c.key) ? ` <span class="ok">· edited</span>` : ""}
        <input class="field ${p ? "missing" : ""}" data-uf="${esc(c.key)}" value="${esc(v)}">${p ? `<span class="warn tiny">${esc(p.text)}</span>` : ""}</label>`;
    }).join("")}</div>`;
  }

  function renderUploadModal(e) {
    const m = e.modal;
    if (!m) return "";
    const small = (title, body) => `<div class="modal-back" data-act="up-close" data-id="${e.id}">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="up-m-${e.id}" data-act="noop"><h3 id="up-m-${e.id}">${title}</h3>${body}</div></div>`;
    const err = e.err ? `<p class="danger">${esc(e.err)}</p>` : "";
    const cancel = `<button type="button" class="link muted-link" data-act="up-close" data-id="${e.id}">Cancel</button>`;
    const twoWays = (once, forever, foreverText) => `<div class="modal-btns">
      <button type="button" class="btn-ghost" data-act="${once}" data-id="${e.id}" style="justify-content:center">This Excel only</button>
      <button type="button" class="btn" style="background:var(--danger);color:var(--bg)" data-act="${forever}" data-id="${e.id}">${foreverText}</button>${cancel}</div>`;
    const col = m.key ? e.cols.find((c) => c.key === m.key) : null;

    if (m.type === "rename") return small(`Rename “${esc(colName(col))}”`, `<p>The new name is used for future Excels too.</p>
      <input class="field" style="margin-top:16px" id="up-in-${e.id}" value="${esc(colName(col))}" aria-label="New name">${err}
      <div class="modal-btns"><button type="button" class="btn" data-act="up-do-rename" data-id="${e.id}">Save</button>${cancel}</div>`);
    if (m.type === "delcol") return small(`Delete “${esc(colName(col))}”?`, `<p>Saved values are kept.</p>${twoWays("up-delcol-once", "up-delcol-forever", "Forever")}`);
    if (m.type === "addcol") return small("Add column", `<input class="field" style="margin-top:16px" id="up-in-${e.id}" placeholder="Column name" aria-label="Column name">${err}
      <div class="modal-btns"><button type="button" class="btn" data-act="up-do-addcol" data-id="${e.id}">Add</button>${cancel}</div>`);

    const r = m.r ? rowOf(e, m.r) : null;
    // A deleted row is left out of this Excel only; if it is in the next Excel it shows up as usual.
    if (m.type === "delrow") return small(`Delete row ${r.added ? "" : r.rowNum}?`, `<p>${esc(r.values.widow_name || "")} won't be imported from this Excel.</p>
      <div class="modal-btns"><button type="button" class="btn" style="background:var(--danger);color:var(--bg)" data-act="up-delrow-once" data-id="${e.id}">Delete</button>${cancel}</div>`);

    // "row" (open a row) and "addrow" (a blank row) use the big pop-up.
    const g = r ? groupOf(r) : "new";
    const title = r ? esc(r.values.widow_name || r.values.soldier_name || "(no name)") : "Add row";
    let sub = "New family, added by you";
    if (r && !r.added) sub = g === "update" ? `Row ${r.rowNum} · update to ${r.code}` : g === "dup" ? `Row ${r.rowNum} · duplicate` : `Row ${r.rowNum} · new family`;
    const changes = r && g === "update" ? `<section class="fsec"><div class="fsec-head"><b>Changes</b></div><div class="table-wrap"><table class="changes"><tbody>
      ${r.changes.map(([l, o, n]) => `<tr><td>${esc(l)}</td><td class="strike">${esc(o ?? "(blank)")}</td><td>${esc(n)}</td></tr>`).join("")}</tbody></table></div></section>` : "";
    const dup = r && g === "dup" ? `<section class="fsec"><div class="fsec-head"><b>Duplicate</b></div>
      <p class="small" style="margin:0 0 10px;color:var(--text)">${r.dupOf ? `Same as row ${r.dupOf} in this Excel.` : `Looks like ${esc(r.code)}, already saved — ${esc(r.reasons.join(", ").toLowerCase())}.`} ${r.included ? "You included it, so it will be imported." : "It is imported only if you include it."}</p></section>` : "";
    return `<div class="modal-back" data-act="up-close" data-id="${e.id}">
      <div class="modal wide fmodal" role="dialog" aria-modal="true" aria-labelledby="up-r-${e.id}" data-act="noop">
        <div class="fmodal-head"><div><h3 id="up-r-${e.id}">${title}</h3><p>${sub}</p></div>
          <button type="button" class="x" data-act="up-close" data-id="${e.id}" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
        <div class="fmodal-body">${changes}${dup}<section class="fsec"><div class="fsec-head"><b>Details</b></div>${upFields(e, r)}</section>${err}</div>
        <div class="fmodal-foot">
          ${r && g !== "dup" ? `<button type="button" class="link" style="color:var(--danger)" data-act="up-delrow" data-id="${e.id}" data-r="${r.id}">Delete row</button>` : "<span></span>"}
          <div style="display:flex;gap:12px;align-items:center">${cancel}
            <button type="button" class="btn" data-act="${r ? "up-save-row" : "up-save-addrow"}" data-id="${e.id}">Save</button></div>
        </div>
      </div>
    </div>`;
  }

  function renderResult(e) {
    const x = e.result;
    return `<div class="panel"><h2 class="ok">Done</h2>
      <p style="margin:8px 0 0">${x.created} new families${x.children ? ` (${x.children} children)` : ""} · ${x.updated} updated</p></div>`;
  }

  // ----- documents -----
  function renderDoc(e) {
    const fam = e.famIdx != null ? S.families[e.famIdx] : null;
    let body = "";
    if (e.stage === "pick") {
      body = `<h3 style="font-size:15px;margin:16px 0 0">Which family is this for?</h3>
        <input class="field" style="margin-top:8px" id="doc-q-${e.id}" data-docq="${e.id}" placeholder="Search by name, family code, district or phone" value="${esc(e.q || "")}">
        <ul class="picker-list" id="doc-list-${e.id}">${familyList(e)}</ul>`;
    } else if (e.stage === "details") {
      body = `<h3 style="font-size:15px;margin:16px 0 0">Who does it belong to?</h3>
        <div class="radios">
          <label><input type="radio" name="belong-${e.id}" data-act="belong" data-id="${e.id}" data-m="" ${e.member == null ? "checked" : ""}> The whole family <span class="muted tiny">(e.g. service booklet, PPO, cancelled cheque)</span></label>
          ${fam.members.map((m) => `<label><input type="radio" name="belong-${e.id}" data-act="belong" data-id="${e.id}" data-m="${m.id}" ${e.member === m.id ? "checked" : ""}> ${esc(m.name)} <span class="muted tiny">${esc(m.rel)}${m.dob ? `, born ${esc(m.dob)}` : ""}</span></label>`).join("")}
        </div>
        <h3 style="font-size:15px;margin:16px 0 0">What is it?</h3>
        <select class="field" style="margin-top:8px" id="doc-type-${e.id}" aria-label="Document type">
          <option value="">Choose the document type...</option>
          ${["Service booklet", "PPO (Pension Payment Order)", "Death certificate", "Mark sheet", "Certificate from school / principal", "Fee receipt", "Bank passbook", "Cancelled cheque", "Contingent bill (CEA)", "Self declaration by NOK", "Aadhaar card", "PAN card", "Birth certificate", "Marriage certificate", "Computer invoice / bill", "Passport photo", "Other"].map((t) => `<option ${e.type === t ? "selected" : ""}>${t}</option>`).join("")}
        </select>
        ${e.docError ? `<p class="danger small">${esc(e.docError)}</p>` : ""}
        <div class="actions" style="border:0;padding-top:0;margin-top:16px">
          <button type="button" class="btn" data-act="save-doc" data-id="${e.id}">Save document</button>
          <button type="button" class="link muted-link" data-act="doc-back" data-id="${e.id}">Different family</button>
        </div>`;
    } else {
      const who = e.member == null ? "the whole family" : fam.members.find((m) => m.id === e.member).name;
      body = `<p class="ok" style="font-size:17px;font-weight:500;margin:16px 0 0">Saved — ${esc(e.type)}, for ${esc(who)}</p>
        <p style="margin:12px 0 0;font-size:14px;font-weight:500">Documents on record for this family</p>
        <ul class="docs">${fam.docs.map((d) => `<li><span>${esc(d.type)} <span class="muted">· ${esc(d.who)}</span></span>${d.file ? `<span class="ok">open</span>` : `<span class="badge">record only</span>`}</li>`).join("")}</ul>`;
    }
    return `<div class="panel">
      <h2>Attach a document</h2>
      <p class="lede">${esc(e.file)}${fam ? ` → <b>${esc(fam.values.widow_name)}</b> (${fam.code})` : ""}</p>
      ${body}
      ${e.stage !== "done" ? `<p class="muted tiny" style="margin:12px 0 0">Nothing has been saved yet.</p>` : ""}
    </div>`;
  }

  function familyList(e) {
    const q = (e.q || "").trim().toLowerCase();
    const found = S.families.map((f, i) => [f, i]).filter(([f]) => !q || [f.values.widow_name, f.code, f.values.district, f.values.phone].join(" ").toLowerCase().includes(q));
    if (!found.length) return `<li class="muted small" style="padding:8px 4px">No family found.</li>`;
    return found.map(([f, i]) => `<li><button type="button" data-act="pick-fam" data-id="${e.id}" data-i="${i}"><b>${esc(f.values.widow_name)}</b><small>${f.code} · ${esc(f.values.soldier_name)} · ${esc(f.values.district)}</small></button></li>`).join("");
  }

  // ---------- CEA form (steps 5 and 6) ----------
  const AS_OF = new Date(2026, 10, 3);
  const CEA_A_YEAR = { normal: 2813 * 12, hostel: 8438 * 12 };
  const rupees = (n) => "₹" + n.toLocaleString("en-IN");
  const ceaIcons = {
    pencil: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>',
    trash: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 7h14M10 7V4.5h4V7M7 7l1 13h8l1-13" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>',
    upload: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  };
  const DOC_TYPES_CEA = ["Mark sheet", "Fee receipt", "Certificate from school", "Contingent bill (CEA)", "Self declaration by NOK", "Cancelled cheque", "Birth certificate", "Other"];

  function parseDmy(s) { const m = /^(\d{1,2})-(\d{1,2})-(\d{4})$/.exec((s || "").trim()); return m ? new Date(+m[3], +m[2] - 1, +m[1]) : null; }
  function ageOf(dob) {
    const d = parseDmy(dob); if (!d) return null;
    let a = AS_OF.getFullYear() - d.getFullYear();
    if (AS_OF < new Date(AS_OF.getFullYear(), d.getMonth(), d.getDate())) a--;
    return a;
  }
  const childrenOf = (fam) => fam.members.filter((m) => m.rel === "son" || m.rel === "daughter");

  // The rule: son or daughter, age 4 to 20 (stands in for KG–Class 12 until class is filled),
  // and one of the two eldest children overall.
  function ceaCheck(fam, m) {
    if (!fam) return { ok: false, reason: "Not in the database yet" };
    if (m.rel !== "son" && m.rel !== "daughter") return { ok: false, reason: "not a son or daughter" };
    const age = ageOf(m.dob);
    if (age == null) return { ok: false, reason: "no date of birth" };
    if (age > 20) return { ok: false, reason: `age ${age}, over 20` };
    if (age < 4) return { ok: false, reason: `age ${age}, under 4` };
    const order = childrenOf(fam).filter((c) => parseDmy(c.dob)).sort((a, b) => parseDmy(a.dob) - parseDmy(b.dob));
    const pos = order.indexOf(m);
    if (pos > 1) return { ok: false, reason: `${pos === 2 ? "3rd" : pos + 1 + "th"} child — CEA is for the two eldest` };
    return { ok: true, reason: "" };
  }
  const ceaAmount = (m) => m.hostel ? CEA_A_YEAR.hostel : CEA_A_YEAR.normal;

  function newCea(stage, file) {
    const e = { id: newId(), kind: "cea", stage, file, items: [], n: 0 };
    S.entries.push(e); S.attach = false;
    return e;
  }
  function fillSuggested(e) {
    e.items = [];
    S.families.forEach((f, fi) => childrenOf(f).forEach((m) => { if (ceaCheck(f, m).ok) addItem(e, fi, m); }));
  }
  function addItem(e, famIdx, m) { e.items.push({ id: `${e.id}-i${++e.n}`, famIdx, m, docs: [], ready: false }); }
  const famOfItem = (it) => it.famIdx == null ? null : S.families[it.famIdx];

  // What the add box can suggest: every family and every child in the database.
  function ceaOptions() {
    const map = new Map();
    S.families.forEach((f, fi) => {
      map.set(`${f.values.widow_name} — family (${f.code}, ${f.values.district})`, { type: "family", fi });
      childrenOf(f).forEach((m) => map.set(`${m.name} (${f.code})`, { type: "child", fi, m }));
    });
    return map;
  }

  function renderCea(e) {
    const chip = e.file ? `<div class="file-chip">${icons.doc}<div><b>${esc(e.file)}</b><small>Form</small></div></div>` : "";
    if (e.stage === "choose") return chip + `<div class="panel">
      <h2>Which form?</h2>
      <div class="cards" style="margin-top:16px">
        <button type="button" class="card-btn" data-act="cea-pick" data-id="${e.id}"><b>CEA</b><span>Children Education Allowance</span></button>
      </div>
    </div>`;
    if (e.stage === "reading") return chip + `<p class="muted">Reading the form...</p>`;
    return chip + renderCeaList(e);
  }

  function renderCeaList(e) {
    const ok = e.items.filter((it) => ceaCheck(famOfItem(it), it.m).ok);
    const total = ok.reduce((n, it) => n + ceaAmount(it.m), 0);
    const ready = e.items.filter((it) => it.ready).length;
    const opts = [...ceaOptions().keys()].map((k) => `<option value="${esc(k)}"></option>`).join("");
    return `<div class="panel">
      ${e.file ? `<p class="ok small" style="margin:0 0 8px">This is the CEA form.</p>` : ""}
      <h2>CEA — who qualifies</h2>
      <p class="lede">${e.items.length} children · ${rupees(total)} a year</p>
      <p class="muted small" style="margin:4px 0 0">Son or daughter · age 4–20 · the two eldest children</p>
      ${e.toast ? `<p class="note small">${esc(e.toast)}</p>` : ""}
      <ul class="list" style="margin-top:12px">${e.items.map((it) => renderCeaRow(e, it)).join("") || `<li class="muted small">No one in the list.</li>`}</ul>
      <div class="add-row" style="grid-template-columns:minmax(0,1fr) auto">
        <input class="field" id="cea-add-${e.id}" list="cea-dl-${e.id}" placeholder="Type a family or a person's name" aria-label="Add a family or person">
        <datalist id="cea-dl-${e.id}">${opts}</datalist>
        <button type="button" class="btn sm" data-act="cea-add" data-id="${e.id}">Add</button>
      </div>
      ${e.addMsg ? `<p class="${e.addWarn ? "warn" : "ok"} small" style="margin:8px 0 0">${esc(e.addMsg)}</p>` : ""}
      <div class="actions">
        <button type="button" class="btn" data-act="cea-all" data-id="${e.id}" ${e.items.length ? "" : "disabled"}>Process CEA for all</button>
        ${ready ? `<button type="button" class="btn-ghost" data-act="cea-download-all" data-id="${e.id}">Download ${ready} PDFs</button>` : ""}
      </div>
      ${renderCeaModal(e)}
    </div>`;
  }

  function renderCeaRow(e, it) {
    const fam = famOfItem(it);
    const chk = ceaCheck(fam, it.m);
    const age = ageOf(it.m.dob);
    const sub = fam ? `${it.m.rel === "son" ? "Son" : "Daughter"} of ${fam.values.widow_name} · ${fam.code} · ${fam.values.district}` : "Not in the database yet";
    return `<li><div class="cea-row">
      <div class="who"><b>${esc(it.m.name)}</b><small>${esc(sub)}${age != null ? ` · age ${age}` : ""}</small>
        ${fam && !chk.ok ? `<small class="warn">Doesn't qualify: ${esc(chk.reason)}</small>` : ""}
        ${it.ready ? `<small class="ok">Form ready</small>` : ""}</div>
      <div class="cea-actions">
        <button type="button" class="icon-sq" data-act="cea-edit" data-id="${e.id}" data-it="${it.id}" title="Edit the form" aria-label="Edit the form for ${esc(it.m.name)}">${ceaIcons.pencil}</button>
        <button type="button" class="icon-sq del" data-act="cea-del" data-id="${e.id}" data-it="${it.id}" title="Remove from this list" aria-label="Remove ${esc(it.m.name)} from this list">${ceaIcons.trash}</button>
        <button type="button" class="btn-ghost" data-act="cea-docs" data-id="${e.id}" data-it="${it.id}" title="Upload documents">${ceaIcons.upload} ${it.docs.length}/10</button>
        <button type="button" class="${it.ready ? "btn-ghost" : "btn sm"}" data-act="cea-process" data-id="${e.id}" data-it="${it.id}">${it.ready ? "Download again" : "Process CEA"}</button>
      </div>
    </div></li>`;
  }

  function renderCeaModal(e) {
    if (!e.modal) return "";
    const it = e.items.find((x) => x.id === e.modal.it);
    const wrap = (title, body, wide) => `<div class="modal-back" data-act="cea-close" data-id="${e.id}">
      <div class="modal ${wide ? "wide" : ""}" role="dialog" aria-modal="true" aria-labelledby="cea-m-${e.id}" data-act="noop">
        <h3 id="cea-m-${e.id}">${title}</h3>${body}</div></div>`;
    if (e.modal.type === "form") return ceaFormModal(e, it);
    if (e.modal.type === "docs") {
      const full = it.docs.length >= 10;
      return wrap(`Documents — ${esc(it.m.name)}`, `<p>${it.docs.length} of 10</p>
        <ul class="docs">${it.docs.map((d, i) => `<li><span>${esc(d)}</span><button type="button" class="link muted-link" data-act="cea-doc-del" data-id="${e.id}" data-i="${i}">remove</button></li>`).join("")}</ul>
        ${full ? `<p class="warn">10 documents is the limit.</p>` : `<label>Type<select class="field" id="cea-doc-type-${e.id}">${DOC_TYPES_CEA.map((t) => `<option>${t}</option>`).join("")}</select></label>`}
        <div class="modal-btns">${full ? "" : `<button type="button" class="btn" data-act="cea-doc-add" data-id="${e.id}">Upload</button>`}
        <button type="button" class="link muted-link" data-act="cea-close" data-id="${e.id}">Done</button></div>`);
    }
    // type "family": an unknown person needs a family before the form can be made.
    return wrap(`Which family is ${esc(it.m.name)} in?`, `<p>${esc(it.m.name)} isn't in the database yet. They'll be saved to this family.</p>
      <label>Family<select class="field" id="cea-fam-${e.id}"><option value="new">New family</option>
        ${S.families.map((f, i) => `<option value="${i}">${esc(f.values.widow_name)} (${f.code}, ${esc(f.values.district)})</option>`).join("")}</select></label>
      <label>Name of NOK (only for a new family)<input class="field" id="cea-nok-${e.id}"></label>
      <label>Son or daughter?<select class="field" id="cea-rel-${e.id}"><option value="son">Son</option><option value="daughter">Daughter</option></select></label>
      ${e.modalErr ? `<p class="danger">${esc(e.modalErr)}</p>` : ""}
      <div class="modal-btns"><button type="button" class="btn" data-act="cea-save-fam" data-id="${e.id}">Continue</button>
      <button type="button" class="link muted-link" data-act="cea-close" data-id="${e.id}">Cancel</button></div>`);
  }

  // The CEA form for one child, filled from the database. "f" = family field, "m" = child field.
  // [key, label, where, wide?]
  const CEA_FORM = [
    ["Child", [["name", "Name", "m"], ["dob", "Date of birth", "m"], ["cls", "Class", "m"], ["school", "School name", "m", true], ["schoolPlace", "School place", "m"], ["board", "Board", "m"], ["admission", "Admission number", "m"], ["hostel", "Hostel", "m"]]],
    ["Next of kin", [["widow_name", "Name of NOK", "f"], ["nok_relationship", "Relationship", "f"], ["phone", "Phone number", "f"], ["correspondence_address", "Correspondence address", "f", true], ["correspondence_pincode", "PIN code", "f"], ["ppo_number", "PPO number", "f"]]],
    ["Bank", [["bank_name", "Bank", "f"], ["bank_branch", "Branch", "f"], ["bank_account_number", "Account number", "f"], ["bank_ifsc", "IFSC code", "f"], ["bank_account_holder", "Account holder's name", "f"]]],
    ["Soldier", [["soldier_name", "Soldier's name", "f"], ["service_number", "Army number", "f"], ["rank", "Rank", "f"], ["unit", "Serving unit", "f"], ["date_of_death", "Date of casualty", "f"], ["record_office", "Record office", "f"]]],
  ];
  function formValue(fam, m, key, where) {
    if (where === "m") return key === "hostel" ? (m.hostel ? "Yes" : "No") : (m[key] || "");
    const v = fam.values;
    if (key === "correspondence_address" && !v[key]) return [v.village, v.post_office, v.tehsil, v.district, v.state].filter(Boolean).join(", ");
    if (key === "correspondence_pincode" && !v[key]) return v.pincode || "";
    if (key === "bank_account_holder" && !v[key]) return v.widow_name || "";
    return v[key] || "";
  }

  // The ✏️ pop-up: header and footer stay put, the sections scroll. Saving writes back to the family and child.
  function ceaFormModal(e, it) {
    const fam = famOfItem(it), m = it.m;
    let missing = 0;
    const secs = CEA_FORM.map(([title, fields]) => {
      let secMissing = 0;
      const cells = fields.map(([k, l, w, wide]) => {
        const v = formValue(fam, m, k, w);
        if (k === "hostel") return `<label>${l}<select class="field" data-cf="hostel" data-w="m"><option ${v === "No" ? "selected" : ""}>No</option><option ${v === "Yes" ? "selected" : ""}>Yes</option></select></label>`;
        if (!v) { missing++; secMissing++; }
        const ph = v ? "" : (k === "dob" ? "DD-MM-YYYY" : "Missing");
        return `<label class="${wide ? "span2" : ""}">${l}<input class="field ${v ? "" : "missing"}" data-cf="${k}" data-w="${w}" value="${esc(v)}" placeholder="${ph}"></label>`;
      }).join("");
      return `<section class="fsec"><div class="fsec-head"><b>${title}</b>${secMissing ? `<span class="warn tiny">${secMissing} missing</span>` : `<span class="ok tiny">Complete</span>`}</div>
        <div class="fgrid">${cells}</div></section>`;
    }).join("");
    return `<div class="modal-back" data-act="cea-close" data-id="${e.id}">
      <div class="modal wide fmodal" role="dialog" aria-modal="true" aria-labelledby="cea-f-${e.id}" data-act="noop">
        <div class="fmodal-head"><div>
            <h3 id="cea-f-${e.id}">CEA form — ${esc(m.name)}</h3>
            <p>${m.rel === "son" ? "Son" : "Daughter"} of ${esc(fam.values.widow_name)} · ${fam.code}</p>
            ${missing ? `<span class="pill-warn">${missing} details missing</span>` : `<span class="pill-ok">All details filled</span>`}
          </div>
          <button type="button" class="x" data-act="cea-close" data-id="${e.id}" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        </div>
        <div class="fmodal-body">${secs}</div>
        <div class="fmodal-foot">
          <div class="amt"><div><span>Academic year</span><b>2025-26</b></div><div><span>Per month</span><b id="cea-rate-${e.id}">${rupees(m.hostel ? 8438 : 2813)}</b></div>
            <div class="big"><span>Amount (12 months)</span><b id="cea-amt-${e.id}">${rupees(ceaAmount(m))}</b></div></div>
          <div style="display:flex;gap:12px;align-items:center">
            <button type="button" class="link muted-link" data-act="cea-close" data-id="${e.id}">Cancel</button>
            <button type="button" class="btn" data-act="cea-save-form" data-id="${e.id}">Save</button>
          </div>
        </div>
      </div>
    </div>`;
  }

  // Writes the form back to the family and child. Returns how many values changed.
  function saveCeaForm(e) {
    const it = e.items.find((x) => x.id === e.formItem);
    const fam = famOfItem(it);
    let changed = 0;
    document.querySelectorAll(`[data-cf]`).forEach((inp) => {
      const k = inp.dataset.cf, w = inp.dataset.w, v = inp.value.trim();
      if (v === formValue(fam, it.m, k, w)) return;
      changed++;
      if (w === "m") it.m[k] = k === "hostel" ? /^y/i.test(v) : v; else fam.values[k] = v;
    });
    return changed;
  }

  function openForm(e, it) { e.formItem = it.id; e.modal = { type: "form", it: it.id }; }
  function makePdf(e, it) { it.ready = true; e.toast = `CEA_${it.m.name.replace(/\s+/g, "_")}.pdf downloaded (prototype: no real file).`; }

  function handleCea(act, t, e) {
    const it = e && t.dataset.it ? e.items.find((x) => x.id === t.dataset.it) : (e?.modal ? e.items.find((x) => x.id === e.modal.it) : null);
    switch (act) {
      case "cea-choose": newCea("choose", null); return true;
      case "cea-upload": { const n = newCea("reading", "CEA 2026.pdf"); setTimeout(() => { fillSuggested(n); n.stage = "list"; render(); }, 700); return true; }
      case "cea-upload-here": e.file = "CEA 2026.pdf"; e.stage = "reading"; setTimeout(() => { fillSuggested(e); e.stage = "list"; render(); }, 700); return true;
      case "cea-pick": fillSuggested(e); e.stage = "list"; return true;
      case "noop": return false;
      case "cea-close": e.modal = null; e.modalErr = null; return true;
      case "cea-edit": if (it.famIdx == null) { e.modal = { type: "family", it: it.id }; return true; } openForm(e, it); return true;
      case "cea-del": e.items = e.items.filter((x) => x !== it); e.toast = `${it.m.name} removed from this list. Still saved in the database.`; return true;
      case "cea-docs": e.modal = { type: "docs", it: it.id }; return true;
      case "cea-doc-add": { const type = document.getElementById(`cea-doc-type-${e.id}`).value; it.docs.push(`${type}.pdf`); return true; }
      case "cea-doc-del": it.docs.splice(+t.dataset.i, 1); return true;
      case "cea-process": if (it.famIdx == null) { e.modal = { type: "family", it: it.id }; return true; } makePdf(e, it); return true;
      case "cea-save-fam": {
        const sel = document.getElementById(`cea-fam-${e.id}`).value;
        const rel = document.getElementById(`cea-rel-${e.id}`).value;
        let fi;
        if (sel === "new") {
          const nok = document.getElementById(`cea-nok-${e.id}`).value.trim();
          if (!nok) { e.modalErr = "Type the name of the NOK for the new family."; return true; }
          S.families.push({ code: `AP-2026-${String(S.families.length + 1).padStart(4, "0")}`, values: { widow_name: nok, district: "" }, members: [{ id: "n" + Date.now(), name: nok, rel: "NOK" }], docs: [] });
          fi = S.families.length - 1;
        } else fi = +sel;
        it.m.rel = rel; S.families[fi].members.push(it.m); it.famIdx = fi;
        e.modal = null; e.modalErr = null; openForm(e, it); return true;
      }
      case "cea-save-form": {
        const n = saveCeaForm(e); const name = it.m.name;
        e.modal = null; e.toast = n ? `${name}: saved ${n} change${n === 1 ? "" : "s"}. Old values kept in history.` : `${name}: nothing changed.`; return true;
      }
      case "cea-all": {
        const known = e.items.filter((x) => x.famIdx != null);
        known.forEach((x) => { x.ready = true; });
        const left = e.items.length - known.length;
        e.toast = `${known.length} forms ready.${left ? ` ${left} need a family first — click Process CEA on them.` : ""}`; return true;
      }
      case "cea-download-all": e.toast = `${e.items.filter((x) => x.ready).length} PDFs downloaded (prototype: no real files).`; return true;
      case "cea-add": {
        const box = document.getElementById(`cea-add-${e.id}`);
        const text = box.value.trim(); if (!text) return false;
        const opts = ceaOptions();
        let opt = opts.get(text);
        if (!opt) { // a plain name: use it if exactly one child has that name
          const hits = [...opts.values()].filter((o) => o.type === "child" && o.m.name.toLowerCase() === text.toLowerCase());
          if (hits.length === 1) opt = hits[0];
        }
        const has = (m) => e.items.some((x) => x.m === m);
        e.addWarn = false;
        if (opt?.type === "family") {
          const fam = S.families[opt.fi];
          const kids = childrenOf(fam);
          const add = kids.filter((m) => ceaCheck(fam, m).ok && !has(m));
          if (add.length) { add.forEach((m) => addItem(e, opt.fi, m)); e.addMsg = `Added ${add.map((m) => m.name).join(", ")}.`; }
          else { e.addWarn = true; e.addMsg = kids.length ? `No one new to add: ${kids.map((m) => `${m.name} (${has(m) ? "already in the list" : ceaCheck(fam, m).reason})`).join(", ")}.` : "This family has no children on record."; }
        } else if (opt?.type === "child") {
          if (has(opt.m)) { e.addWarn = true; e.addMsg = `${opt.m.name} is already in the list.`; }
          else {
            addItem(e, opt.fi, opt.m);
            const chk = ceaCheck(S.families[opt.fi], opt.m);
            e.addWarn = !chk.ok; e.addMsg = chk.ok ? `Added ${opt.m.name}.` : `Added ${opt.m.name}, but they don't qualify: ${chk.reason}.`;
          }
        } else {
          addItem(e, null, { id: "u" + Date.now(), name: text, rel: "", dob: "", cls: "", school: "", schoolPlace: "", board: "", admission: "", hostel: false });
          e.addWarn = true; e.addMsg = `Added ${text}. Not in the database yet — you'll pick the family when you click Process CEA.`;
        }
        return true;
      }
      default: return false;
    }
  }

  // ---------- actions ----------
  function dropExcel(variant) {
    const e = { id: newId(), kind: "excel", variant, file: variant === "extra" ? "widows_sheet_with_extra_columns.xlsx" : "widows_sheet_sample.xlsx", size: variant === "extra" ? "10 KB" : "13 KB",
      stage: "reading", cols: [], open: {}, rows: [] };
    // S NO and DOCUMENTS have no column (key null), so they are not shown at all.
    for (const [h, key] of headingsOf(variant)) {
      if (!key || S.alwaysOff.has(key) || e.cols.some((c) => c.key === key)) continue;
      e.cols.push({ key, heading: h, isNew: key.startsWith("extra:") && !S.extras[key] });
    }
    e.rows = buildRows(variant, S.families);
    if (variant === "extra") e.rows.forEach((r) => { r.values["extra:unit"] = r.values.unit; });
    S.entries.push(e); S.attach = false; render();
    setTimeout(() => { e.stage = "columns"; render(); }, 600);
  }

  function dropDoc() {
    S.entries.push({ id: newId(), kind: "doc", file: "marksheet_class10.pdf", size: "240 KB", stage: "pick" });
    S.attach = false; render();
  }

  // Values typed in the row pop-up. A valid phone is tidied to +91.
  function readFields(row) {
    document.querySelectorAll("[data-uf]").forEach((inp) => {
      const k = inp.dataset.uf, v = inp.value.trim();
      if (v === display(k, String(row.values[k] || ""))) return;
      row.edited.add(k);
      row.values[k] = PHONE_KEYS.has(k) && phoneDigits(v).length === 10 ? cleanPhone(v) : v;
    });
  }

  function runImport(e) {
    const rows = liveRows(e).filter(willImport);
    const created = rows.filter((r) => groupOf(r) !== "update");
    e.result = { created: created.length, updated: rows.length - created.length,
      children: created.reduce((n, r) => n + [1, 2, 3].filter((s) => r.values[`child${s}_name`]).length, 0) };
    e.stage = "done";
  }

  function handleUpload(act, t, e) {
    const r = e && t.dataset.r ? rowOf(e, t.dataset.r) : null;
    const typed = () => document.getElementById(`up-in-${e.id}`).value.trim();
    const nameTaken = (text, except) => e.cols.some((c) => c.key !== except && colName(c).toLowerCase() === text.toLowerCase());
    const done = () => { e.modal = null; e.err = null; return true; };
    switch (act) {
      case "up-close": return done();
      case "up-rename": e.modal = { type: "rename", key: t.dataset.key }; return true;
      case "up-do-rename": {
        const text = typed();
        if (!text) { e.err = "Type a name."; return true; }
        if (nameTaken(text, e.modal.key)) { e.err = `There is already a column called “${text}”.`; return true; }
        S.renamed[e.modal.key] = text; return done();
      }
      case "up-delcol": e.modal = { type: "delcol", key: t.dataset.key }; return true;
      case "up-delcol-once": e.cols = e.cols.filter((c) => c.key !== e.modal.key); return done();
      case "up-delcol-forever": S.alwaysOff.add(e.modal.key); e.cols = e.cols.filter((c) => c.key !== e.modal.key); return done();
      case "up-addcol": e.modal = { type: "addcol" }; return true;
      case "up-do-addcol": {
        // A name we already know uses that column; any other name makes a new one.
        const text = typed();
        if (!text) { e.err = "Type a column name."; return true; }
        if (nameTaken(text)) { e.err = `“${text}” is already in this Excel.`; return true; }
        let key = [...Object.keys(FIELDS), ...Object.keys(S.extras)].find((k) => label(k, S.extras).toLowerCase() === text.toLowerCase());
        if (!key) { key = "extra:" + slug(text); S.extras[key] = { label: text }; }
        S.alwaysOff.delete(key);
        e.cols.push({ key, heading: text, isNew: false }); return done();
      }
      case "up-continue":
        for (const c of e.cols) if (c.isNew) { S.extras[c.key] = { label: c.heading }; c.isNew = false; }
        e.stage = "rows"; return true;
      case "up-back": e.stage = "columns"; return true;
      case "up-row": e.modal = { type: "row", r: r.id }; return true;
      case "up-delrow": e.modal = { type: "delrow", r: r.id }; return true;
      case "up-delrow-once": rowOf(e, e.modal.r).deleted = true; return done();
      case "up-save-row": readFields(rowOf(e, e.modal.r)); return done();
      case "up-include": r.included = !r.included; return true;
      case "up-addrow": e.modal = { type: "addrow" }; return true;
      case "up-save-addrow": {
        const row = { values: {}, edited: new Set(), changes: [], action: "create", added: true };
        readFields(row);
        if (!row.values.soldier_name || !row.values.widow_name) { e.err = "Fill in the soldier's name and the name of the NOK."; return true; }
        row.edited.clear();
        row.rowNum = Math.max(...e.rows.map((x) => x.rowNum)) + 1; row.id = "r" + row.rowNum;
        e.rows.push(row); e.open.new = true; return done();
      }
      case "up-import": runImport(e); return true;
      default: return false;
    }
  }

  document.addEventListener("click", (ev) => {
    const t = ev.target.closest("[data-act]");
    if (!t) { if (S.attach && !ev.target.closest(".composer")) { S.attach = false; render(); } return; }
    const act = t.dataset.act;
    const e = t.dataset.id ? entry(t.dataset.id) : null;

    switch (act) {
      case "reset": rand = rng(4242); reset(); window.scrollTo(0, 0); return;
      case "open-menu": S.menu = true; break;
      case "close-menu": S.menu = false; break;
      case "toggle-attach": S.attach = !S.attach; break;
      case "drop-excel": dropExcel(t.dataset.variant); return;
      case "drop-doc": dropDoc(); return;
      case "send": sendText(); return;
      case "toggle": e[t.dataset.key] = !e[t.dataset.key]; if (t.dataset.key === "adding") e.colError = null; break;
      case "toggle-group": { const g = t.dataset.g; const cur = e.open[g] ?? g === "dup"; e.open[g] = !cur; break; }
      case "pick-fam": e.famIdx = +t.dataset.i; e.member = null; e.type = ""; e.stage = "details"; break;
      case "belong": e.member = t.dataset.m || null; return; // radio state is already shown
      case "doc-back": e.stage = "pick"; e.famIdx = null; break;
      case "save-doc": {
        const type = document.getElementById(`doc-type-${e.id}`).value;
        if (!type) { e.docError = "Choose the document type."; break; }
        const fam = S.families[e.famIdx];
        e.type = type; e.docError = null;
        fam.docs.unshift({ type, who: e.member == null ? "Whole family" : fam.members.find((m) => m.id === e.member).name, file: true });
        e.stage = "done"; break;
      }
      default: if (!handleUpload(act, t, e) && !handleCea(act, t, e)) return;
    }
    render();
  });

  document.addEventListener("input", (ev) => {
    const t = ev.target;
    if (t.dataset.edit) { const e = entry(t.dataset.id); e.draft[t.dataset.edit] = t.value; return; }
    if (t.dataset.docq) { const e = entry(t.dataset.docq); e.q = t.value; document.getElementById(`doc-list-${e.id}`).innerHTML = familyList(e); return; }
    if (t.id === "prompt-input") {
      document.getElementById("send-btn").disabled = !t.value.trim();
      t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 160) + "px";
    }
  });

  // Hostel Yes/No in the form changes the amount straight away.
  document.addEventListener("change", (ev) => {
    const t = ev.target;
    if (t.dataset.cf !== "hostel") return;
    const e = S.entries.find((x) => x.modal?.type === "form");
    if (!e) return;
    const yes = t.value === "Yes";
    document.getElementById(`cea-rate-${e.id}`).textContent = rupees(yes ? 8438 : 2813);
    document.getElementById(`cea-amt-${e.id}`).textContent = rupees(yes ? CEA_A_YEAR.hostel : CEA_A_YEAR.normal);
  });

  // Esc closes the remove pop-up.
  document.addEventListener("keydown", (ev) => {
    if (ev.key !== "Escape") return;
    const open = S.entries.find((x) => x.removing || x.renaming || x.modal);
    if (open) { open.removing = null; open.renaming = null; open.modal = null; render(); }
  });

  document.getElementById("prompt-input").addEventListener("keydown", (ev) => {
    if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); sendText(); }
  });

  function sendText() {
    const box = document.getElementById("prompt-input");
    const text = box.value.trim();
    if (!text) return;
    S.entries.push({ id: newId(), kind: "text", text });
    box.value = ""; box.style.height = "auto"; document.getElementById("send-btn").disabled = true;
    render();
  }

  reset();
})();
</script>
