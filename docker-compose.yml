services:
  db:
    image: postgis/postgis:16-3.4
    container_name: army_passion_db
    environment:
      POSTGRES_USER: army
      POSTGRES_PASSWORD: army_dev_password
      POSTGRES_DB: army_passion
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U army -d army_passion"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: army_passion_redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
