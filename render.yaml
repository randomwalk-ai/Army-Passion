# Render blueprint: the screens (frontend) and the API (backend), both built
# from their Dockerfiles. The database is on Supabase, not Render.
# Step-by-step instructions: docs/deploy-render.md
#
# Values marked `sync: false` are asked for when the blueprint is created
# (secrets, and the two addresses that only exist after the first deploy).

services:
  - type: web
    name: army-passion-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    branch: feature/dashboard-and-cea
    healthCheckPath: /health
    envVars:
      # Supabase -> Connect -> "Session pooler" link (works over IPv4).
      - key: DATABASE_URL
        sync: false
      # The frontend's address, e.g. https://army-passion-web.onrender.com
      - key: CORS_ORIGINS
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: APP_ENV
        value: production
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: SECRET_KEY
        generateValue: true
      - key: STORAGE_PROVIDER
        value: local
      # Render's free plan has no permanent disk: uploaded documents are lost
      # when the service restarts. Fine for mock data.
      - key: LOCAL_STORAGE_PATH
        value: /data/storage
      # The free plan has 512 MB of memory: one worker.
      - key: WEB_CONCURRENCY
        value: "1"
      # Error reporting: the DSN of the Sentry "FastAPI" project. Empty = off.
      - key: SENTRY_DSN
        sync: false

  - type: web
    name: army-passion-web
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    branch: feature/dashboard-and-cea
    envVars:
      # The API's address, e.g. https://army-passion-api.onrender.com
      # Baked into the screens when they are built: after changing it, redeploy.
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_USER_NAME
        value: Demo User
      - key: NEXT_PUBLIC_USER_ROLE
        value: Administrator
      # Error reporting: the DSN of the Sentry "Next.js" project. Empty = off.
      # Baked in when the screens are built: after changing it, redeploy.
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
